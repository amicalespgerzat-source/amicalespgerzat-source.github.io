# Agenda et notifications de l'amicale
# Lance .github/amicale.py :
#  - à chaque modification de index.html, et toutes les heures en journée pour suivre le Google Sheets « Agenda de l'amicale » ;
#  - chaque soir vers 18 h, heure de Paris (rappels 15 jours avant et la veille).
# La clé OneSignal est dans les secrets du dépôt, sous le nom ONESIGNAL_CLE.
name: Agenda de l'amicale

on:
  push:
    branches: [main]
    paths: [index.html]
  schedule:
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
    # Toutes les heures en journée : une date ajoutée dans le Google Sheets est annoncée dans l'heure
    - cron: "41 6-19 * * *"
  workflow_dispatch:
    inputs:
      essai:
        description: "Envoyer une notification de test à tous les abonnés"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: amicale
  cancel-in-progress: false

jobs:
  agenda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Agenda et notifications
        env:
          ONESIGNAL_CLE: ${{ secrets.ONESIGNAL_CLE }}
          TEST_ENVOI: ${{ inputs.essai }}
        run: python3 .github/amicale.py

      - name: Enregistrer et mettre en ligne
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A -- 'agenda/*.ics' agenda/notifications.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Agenda et notifications mis à jour automatiquement"
          git pull --rebase
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
