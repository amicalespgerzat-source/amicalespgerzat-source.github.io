# Listes des inscrits HelloAsso de l'amicale
# Lance .github/helloasso.py toutes les heures de 7 h à 23 h (heure de Paris, à peu près),
# à chaque modification de index.html, ou à la main (Run workflow).
# Secrets du dépôt : HELLOASSO_ID, HELLOASSO_SECRET et CODE_AMICALE.
name: Inscrits HelloAsso

on:
  push:
    branches: [main]
    paths: [index.html]
  schedule:
    - cron: "23 6-22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: amicale
  cancel-in-progress: false

jobs:
  inscrits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Outil de chiffrement
        run: pip install --quiet cryptography

      - name: Lire les inscrits sur HelloAsso
        env:
          HELLOASSO_ID: ${{ secrets.HELLOASSO_ID }}
          HELLOASSO_SECRET: ${{ secrets.HELLOASSO_SECRET }}
          CODE_AMICALE: ${{ secrets.CODE_AMICALE }}
        run: python3 .github/helloasso.py

      - name: Enregistrer et mettre en ligne
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add agenda/inscrits-*.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Liste des inscrits mise à jour automatiquement"
          git pull --rebase
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
