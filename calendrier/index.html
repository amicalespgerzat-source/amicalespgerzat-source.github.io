<style>
/* Layout: plein écran, carte à gauche, panneau des tournées à droite (empilés sur téléphone) */
:root {
  --bg: #eceef0;
  --panel: #ffffff;
  --map: #e3e6e9;

  --warn: #b7791f;
  --bad: #c42b2b;
  --halo: rgba(255,255,255,.85);
  --land: #f1f0ec; --bldg: #dfdbd3; --bldg-edge: #cdc7bc; --road: #ffffff; --casing: #cbc6bd;
  --major: #fbe3b3; --major-casing: #d8ad62; --motorway: #f2b866; --path: #b3ada2; --rail: #7d838a;
  --water: #a8cbe6; --green: #d6e7cd; --cem: #d3dccb;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13171b; --panel: #1b2025; --map: #0f1316; --street: #2f373f; --dot: #8d97a1;
  --fg: #e5e8eb; --muted: #9aa4ad; --line: #2c343b; --soft: #222930; --accent: #ec5a4e; --accent-fg: #160a09;
  --ok: #4cb37a; --warn: #e0a43f; --bad: #ec5a4e; --halo: rgba(15,19,22,.85); --land: #13181c; --bldg: #252c33; --bldg-edge: #2f373f; --road: #3b444d; --casing: #0d1114;
  --major: #6a5634; --major-casing: #0d1114; --motorway: #8a6a3a; --path: #4a535c; --rail: #6d747c;
  --water: #1f3b52; --green: #1d2b22; --cem: #1f2a24; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #13171b; --panel: #1b2025; --map: #0f1316; --street: #2f373f; --dot: #8d97a1;
  --fg: #e5e8eb; --muted: #9aa4ad; --line: #2c343b; --soft: #222930; --accent: #ec5a4e; --accent-fg: #160a09;
  --ok: #4cb37a; --warn: #e0a43f; --bad: #ec5a4e; --halo: rgba(15,19,22,.85); --land: #13181c; --bldg: #252c33; --bldg-edge: #2f373f; --road: #3b444d; --casing: #0d1114;
  --major: #6a5634; --major-casing: #0d1114; --motorway: #8a6a3a; --path: #4a535c; --rail: #6d747c;
  --water: #1f3b52; --green: #1d2b22; --cem: #1f2a24; color-scheme: dark }

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.4; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .lg { height: 30px; width: auto; border-radius: 6px; display: block; }
.topbtns { display: flex; gap: 6px; flex-wrap: wrap; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 6px 10px; border-radius: 8px; font-weight: 600; font-size: 13px; text-decoration: none; }
.tbtn svg { width: 16px; height: 16px; flex: none; }
.tbtn:hover { background: var(--soft); }
.brand h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: .2px; text-wrap: balance; }
.brand .year { font-family: var(--font-map); font-weight: 600; font-size: 13px; color: var(--accent); letter-spacing: .6px; text-transform: uppercase; }
.tabs { display: flex; gap: 4px; background: var(--soft); padding: 3px; border-radius: 8px; }
.tabs button { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; font-weight: 600; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.tabs button .wait { font-weight: 400; font-size: 12px; opacity: .8; }
.status { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.status .dotst { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status[data-s="ok"] .dotst { background: var(--ok); }
.status[data-s="saving"] .dotst { background: var(--warn); }
.status[data-s="local"] .dotst, .status[data-s="err"] .dotst { background: var(--bad); }

main.work { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 370px; }
.mapwrap { position: relative; min-width: 0; min-height: 0; background: var(--map); overflow: hidden; }
canvas#map { display: block; width: 100%; height: 100%; touch-action: none; }
canvas#map.lasso { cursor: crosshair; }
canvas#map.pan { cursor: grab; }

.toolbar {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 12px; right: 12px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none;
}
.toolbar > * { pointer-events: auto; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--panel); }
.seg button:disabled { opacity: .4; cursor: default; }
.seg svg { width: 16px; height: 16px; }
.chip-active { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px 6px 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); font-weight: 600; }
.chip-active .sw { width: 18px; height: 18px; border-radius: 5px; }
.chip-active small { font-weight: 500; color: var(--muted); }
.zoom { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 14px; display: flex; flex-direction: column; }
.zoom.seg button + button { border-left: 0; border-top: 1px solid var(--line); }
.zoom button { padding: 8px 11px; font-size: 18px; line-height: 1; }

.hint {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 14px; max-width: min(380px, calc(100% - 90px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: 0 2px 8px rgba(0,0,0,.12); font-size: 14px;
}
.hint b { display: block; margin-bottom: 3px; }
.hint p { margin: 0; color: var(--muted); }
.addr {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 14px; width: min(360px, calc(100% - 90px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: 0 2px 10px rgba(0,0,0,.16);
}
.addr .head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.addr .num { font-size: 17px; font-weight: 700; }
.addr .cur { font-size: 13px; color: var(--muted); margin-top: 2px; }
.addr .x { border: 0; background: transparent; font-size: 20px; line-height: 1; padding: 0 2px; color: var(--muted); }
.addr .ckrow { display: flex; gap: 6px; margin-top: 10px; }
.addr .ckrow .btn { flex: 1; }
.rues .seemap.linkbtn { display: block; margin: 2px 0 4px; font-size: 13px; }
.rues .selact { display: flex; gap: 6px; margin: 4px 0 6px; }
.rues .selact .btn { flex: 1; padding: 8px 6px; font-size: 14px; }
.chips button.hl { outline: 3px solid var(--fg); outline-offset: 1px; }
.addr .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.btn { border: 1px solid var(--line); background: var(--soft); border-radius: 7px; padding: 7px 10px; font-weight: 600; font-size: 14px; text-align: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }

aside.panel { background: var(--panel); border-left: 1px solid var(--line); min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.sum { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sum div { min-width: 0; }
.sum .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.sum .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.sum .v.free { color: var(--warn); }
.sum .note { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.listhead { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 6px; gap: 8px; }
.listhead h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
.sectors { list-style: none; margin: 0; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 2px; }
.srow { border-radius: 8px; }
.srow > button.pick {
  width: 100%; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 8px 8px;
  display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 4px 10px; align-items: center; text-align: left;
}
.srow > button.pick:hover { background: var(--soft); }
.srow.on > button.pick { border-color: var(--fg); background: var(--soft); }
.srow .sw { width: 22px; height: 22px; border-radius: 6px; grid-row: span 2; }
.srow .nm { font-weight: 700; font-size: 16px; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.srow .nm span { font-weight: 500; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .ct { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.srow .ct small { display: block; font-size: 12px; font-weight: 600; }
.ct small.lbl { color: var(--muted); font-weight: 500; }
.ct small.ok { color: var(--ok); } .ct small.warn { color: var(--warn); } .ct small.bad { color: var(--bad); }
.bar { grid-column: 2 / 4; height: 6px; background: var(--soft); border-radius: 3px; position: relative; overflow: hidden; }
.srow.on .bar { background: var(--panel); }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.bar i.rep { background: var(--warn); border-radius: 0 3px 3px 0; }
.bar b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--fg); opacity: .5; }
.detail { padding: 6px 10px 14px 40px; display: grid; gap: 10px; }
.detail label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; display: grid; gap: 3px; }
.detail input { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 8px; font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--fg); }
.detail .two { display: grid; grid-template-columns: 90px minmax(0,1fr); gap: 8px; }
.colors { display: flex; flex-wrap: wrap; gap: 5px; }
.colors button { width: 22px; height: 22px; border-radius: 5px; border: 2px solid transparent; padding: 0; }
.colors button[aria-pressed="true"] { border-color: var(--fg); }
.rues { font-size: 14px; border-top: 1px solid var(--line); padding-top: 8px; }
.rues h3 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.rues ul { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; }
.ckprog { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; margin: 2px 0 6px; }
.ckprog .bar { flex: 1 1 100%; order: 3; display: block; min-width: 80px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.ckprog .bar i { position: absolute; top: 0; bottom: 0; }
.filt { display: flex; gap: 4px; flex-wrap: wrap; margin: 0 0 8px; }
.filt button { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 999px; padding: 5px 10px; font-size: 12.5px; font-weight: 600; }
.filt button b { font-variant-numeric: tabular-nums; }
.filt button.on { background: var(--fg); border-color: var(--fg); color: var(--panel); }
.chips button.d2 { background: var(--warn); border-color: var(--warn); color: #fff; }
.rues .c i { font-style: normal; color: var(--warn); font-weight: 700; }
.replist { margin: 10px 0 0; border-top: 1px solid var(--line); padding-top: 8px; }
.replist h3 { margin: 0 0 6px; font-size: 14px; color: var(--warn); }
.replist ul { list-style: none; margin: 0; padding: 0; max-height: 190px; overflow: auto; }
.replist li { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 13.5px; }
.replist li .nm { flex: 1; min-width: 0; text-align: left; }
.nextad { position: absolute; left: 10px; right: 64px; bottom: 26px; z-index: 6; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.18); padding: 8px 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.nextad .t { flex: 1 1 140px; min-width: 0; font-size: 14px; line-height: 1.25; }
.nextad .t b { display: block; font-size: 15px; }
.nextad .t small { color: var(--muted); }
.nextad .btn { padding: 7px 10px; font-size: 13.5px; }
.rues li.ck { grid-template-columns: 26px minmax(0,1fr) auto; align-items: start; }
.rues li .box { width: 22px; height: 22px; border: 2px solid var(--muted); border-radius: 5px; background: var(--panel); display: grid; place-items: center; padding: 0; color: #fff; font-weight: 800; font-size: 14px; line-height: 1; }
.rues li .box[aria-pressed="true"] { border-color: transparent; }
.rues li .box[aria-pressed="mixed"] { border-style: dashed; }
.rues li .rn { cursor: pointer; }
.rues li.done .r { text-decoration: line-through; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 4px; }
.chips button { min-width: 34px; height: 30px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; font-size: 13px; font-variant-numeric: tabular-nums; padding: 0 6px; }
.chips button[aria-pressed="true"] { color: #fff; border-color: transparent; text-decoration: line-through; }
.chips .sep { flex-basis: 100%; height: 0; }
.rues li { padding: 4px 0; border-bottom: 1px dashed var(--line); display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; }
.rues li .r { font-weight: 600; }
.rues li .n { color: var(--muted); font-size: 13px; }
.rues li .c { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.rowbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.confirm { background: var(--soft); border-radius: 8px; padding: 8px 10px; font-size: 14px; display: grid; gap: 8px; }
.linkbtn { border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 13px; padding: 2px 4px; }
.search { padding: 12px 16px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--soft); border-radius: 8px; padding: 8px 10px; font-size: 15px; color: var(--fg); }
.search ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.search li button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 6px 8px; display: grid; grid-template-columns: 14px minmax(0,1fr) auto; gap: 8px; align-items: center; }
.search li button:hover { border-color: var(--muted); }
.search .sw { width: 14px; height: 14px; border-radius: 4px; }
.search .t { font-weight: 700; white-space: nowrap; }
.search .d { color: var(--muted); font-size: 13px; }
.search p { margin: 0; font-size: 13px; color: var(--muted); }
.search li p button { display: inline; width: auto; border: 0; background: transparent; padding: 2px 4px; margin: 0 2px; color: var(--accent); font-weight: 600; }
.rues li .o { display: inline-block; min-width: 20px; height: 20px; border-radius: 10px; color: #fff; font-size: 12px; font-weight: 700; text-align: center; line-height: 20px; margin-right: 6px; }
.guidelink { display: block; margin: 8px 2px 0; font-size: 13px; font-weight: 600; color: var(--accent); }
.tlink { font-size: 13px; color: var(--muted); }
.tlink a { color: var(--accent); font-weight: 600; }
.tlink .linkbtn { padding: 0; }
.foot { margin-top: auto; padding: 12px 16px 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.foot p { margin: 0; flex: 1 1 100%; font-size: 12px; color: var(--muted); }
.osm { position: absolute; right: max(60px, calc(env(safe-area-inset-right, 0px) + 60px)); bottom: 4px; font-size: 11px; color: var(--muted); background: var(--halo); padding: 1px 6px; border-radius: 4px; }
.ro #mLasso, .ro #bErase, .ro #bUndo, .ro #bAdd, .ro .addr .acts, .ro #dDel, .ro .colors, .ro #chipActive, .ro #mPan { display: none !important; }
.views button { min-width: 0; }
body[data-view="tour"] .toolbar .seg:first-child, body[data-view="tour"] #chipActive, body[data-view="tour"] #bErase, body[data-view="tour"] #bUndo,
body[data-view="bilan"] .toolbar .seg:first-child, body[data-view="bilan"] #chipActive, body[data-view="bilan"] #bErase, body[data-view="bilan"] #bUndo { display: none !important; }
body[data-view="tour"] #hint, body[data-view="tour"] #addr, body[data-view="bilan"] #hint, body[data-view="bilan"] #addr { display: none !important; }
#tourPanel { display: flex; flex-direction: column; min-height: 0; }
.tpick { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px 4px; }
.tpick button { border: 2px solid var(--c); background: var(--panel); color: var(--fg); border-radius: 7px; padding: 4px 10px; font-weight: 700; }
.tpick button[aria-pressed="true"] { background: var(--c); color: #fff; }

.prog { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--ok); }
.today { background: var(--soft); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.today h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
.tgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }

.tgrid span { font-size: 11px; color: var(--muted); }

.vfilt button[aria-pressed="true"] { background: var(--fg); color: var(--panel); border-color: var(--fg); }

.vrow:hover { background: var(--soft); }
.vnum { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }

const POIS = {}, SHOWPOI = { on: true };

function drawPoi(sc) {
  const L = POIS[S.communeId]; if (!SHOWPOI.on || !L || sc < 0.35) return;

  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = `italic 600 ${sc > 1.1 ? 14 : 12}px ${cssVar("--font-map")}`;
  for (const [x, y, k, nm] of L) {
    if (k !== "zone") continue;
    const X = sx(x), Y = sy(y); if (X < -100 || Y < -20 || X > W + 100 || Y > H + 20) continue;
    ctx.lineWidth = 3.5; ctx.strokeStyle = cssVar("--halo"); ctx.strokeText(nm, X, Y); ctx.fillStyle = "#455a64"; ctx.fillText(nm, X, Y);
  }

  const list = L.filter(p => p[2] !== "zone" && (sc > 0.7 || ["mairie", "ecole", "pharmacie", "poste", "culte", "pompiers"].includes(p[2])))
    .sort((a, b) => order.indexOf(a[2]) - order.indexOf(b[2]));

  for (const [x, y, k, nm] of list) {
    const X = sx(x), Y = sy(y); if (X < -20 || Y < -20 || X > W + 20 || Y > H + 20) continue;

      ctx.lineWidth = 3; ctx.strokeStyle = cssVar("--halo"); ctx.strokeText(nm, X + R + 3, Y);

const ZONES = {};
async function loadZones(c) {

function docRef() { return S.db.doc("plans/" + S.communeId); }
function applyPlan(d) {
  const n = S.data.pts.length;
  S.plan = { sectors: Array.isArray(d.sectors) ? d.sectors.map(s => ({ ...s })) : [], v: d.v || S.data.version };
  const a = typeof d.assign === "string" ? d.assign : "";
  S.assign = a.length === n ? a.split("") : new Array(n).fill(".");
  if (a.length && a.length !== n) toast("Le fichier d'adresses a changé, les tournées sont à refaire");
  if (S.active && !sectorBy(S.active)) S.active = null;
  if (!S.active && S.plan.sectors.length) S.active = S.plan.sectors[0].c;
  if (LINK && LINK.commune === S.communeId && !LINK.name) LINK = null;
  if (LINK && LINK.commune === S.communeId) {
    const t = S.plan.sectors.find(x => norm(x.name) === norm(LINK.name));

}
function subscribePlan() {
  const id = S.communeId;
  if (S.unsub) { S.unsub(); S.unsub = null; }
  if (S.local) { loadSnapshot(); return; }
  if (!S.db) return;
  let timer = setTimeout(() => setStatus("err", "Données pas encore joignables"), 10000);
  S.unsub = docRef().onSnapshot(snap => {
    if (id !== S.communeId) return;
    if (!snap.metadata.fromCache) { clearTimeout(timer); }
    if (S.dirty || S.saving) return; // une modification locale attend d'être enregistrée
    if (snap.exists) applyPlan(snap.data());
    if (S.view !== "plan") { if (!S.tour || !sectorBy(S.tour)) S.tour = S.plan.sectors[0]?.c || null; subscribeVisits(); }
    else if (!snap.metadata.fromCache) { loadSnapshot(); return; }
    setStatus("ok", snap.metadata.fromCache ? "Synchronisation…" : "À jour, partagé avec le bureau");
    renderAll();
  }, err => {
    clearTimeout(timer);
    if (err.code === "revoked") { setStatus("err", "Accès retiré"); return; }
    setStatus("err", "Connexion perdue, modifications non enregistrées");
  });
}
function scheduleSave() {
  if (S.readonly) return;
  S.dirty = true;

  setStatus("saving", "Modification en cours…");
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(doSave, 900);
}
async function doSave() {
  if (!S.db) return;
  if (S.saving) { S.pendingSave = true; return; }
  S.saving = true; S.dirty = false;
  const body = { sectors: S.plan.sectors, assign: S.assign.join(""), v: S.data.version, updatedAt: new Date().toISOString() };
  try { await docRef().set(body); setStatus("ok", "Enregistré"); }
  catch (e) {
    if (e && e.code === "invalid_argument") { setReadonly(true); setStatus("ok", "Consultation seule"); subscribePlan(); renderAll(); }
    else if (e && e.code === "unavailable") { S.dirty = true; setTimeout(doSave, 1500 + Math.random() * 1000); }
    else setStatus("err", "Échec de l'enregistrement");

    S.saving = false;

  }
}
function lsKey() { return "secteurs-" + S.communeId; }
let SNAP = null;

/* ---------- Modifications ---------- */
function snapshotHist() {
  S.history.push({ assign: S.assign.join(""), sectors: JSON.stringify(S.plan.sectors) });
  if (S.history.length > 40) S.history.shift();
  $("bUndo").disabled = false;
}
function undo() {
  if (S.readonly) return;
  const h = S.history.pop(); if (!h) return;
  S.assign = h.assign.split(""); S.plan.sectors = JSON.parse(h.sectors);
  if (S.active && !sectorBy(S.active)) S.active = S.plan.sectors[0]?.c || null;
  $("bUndo").disabled = !S.history.length;
  scheduleSave(); renderAll(); toast("Action annulée");
}
function targetCode() { return S.erase ? "." : S.active; }
function assignIdx(list) {
  if (S.readonly) return 0;
  const code = targetCode();
  if (!code) { toast("Choisis d'abord une tournée à droite"); return 0; }
  let n = 0;
  for (const i of list) if (S.assign[i] !== code) n++;

  snapshotHist();

}
function newSector() {
  if (S.readonly) return;
  const used = new Set(S.plan.sectors.map(s => s.c));
  const c = [...CODES].find(x => !used.has(x)); if (!c) return;
  const usedCol = new Set(S.plan.sectors.map(s => s.color));
  let color = 0; while (usedCol.has(color) && color < PALETTE.length - 1) color++;
  const nums = S.plan.sectors.map(s => parseInt(String(s.name).replace(/\D/g, ""), 10)).filter(n => !isNaN(n));
  const name = "T" + ((nums.length ? Math.max(...nums) : 0) + 1);
  snapshotHist();
  S.plan.sectors.push({ c, name, color });
  S.active = c; S.erase = false; S.open = c;
  scheduleSave(); renderAll();
}
function deleteSector(c) {
  if (S.readonly) return;
  snapshotHist();
  for (let i = 0; i < S.assign.length; i++) if (S.assign[i] === c) S.assign[i] = ".";
  S.plan.sectors = S.plan.sectors.filter(s => s.c !== c);
  if (S.active === c) S.active = S.plan.sectors[0]?.c || null;
  S.open = null; S.confirmDel = null;

}

/* ---------- Statistiques ---------- */
function counts() {
  const m = {}; let free = 0;
  for (const a of S.assign) { if (a === ".") free++; else m[a] = (m[a] || 0) + 1; }
  return { m, free };
}
function streetsOf(c) {
  const by = new Map(), totals = new Map();
  S.data.pts.forEach((p, i) => {
    totals.set(p[2], (totals.get(p[2]) || 0) + 1);
    if (S.assign[i] === c) { if (!by.has(p[2])) by.set(p[2], []); by.get(p[2]).push(p[3]); }
  });
  const out = [];
  for (const [v, nums] of by) {
    const ev = nums.filter(n => n % 2 === 0), od = nums.filter(n => n % 2 === 1);
    const part = [];
    const rng = (a, w) => { if (!a.length) return; const mn = Math.min(...a), mx = Math.max(...a); part.push(mn === mx ? `${w} ${mn}` : `${w} ${mn} à ${mx}`); };
    const whole = nums.length === totals.get(v);
    if (!whole) { rng(od, "impairs"); rng(ev, "pairs"); }
    out.push({ v, name: S.data.voies[v], n: nums.length, detail: whole ? "rue entière" : part.join(", "), first: Math.min(...nums) });
  }
  out.sort((a, b) => b.n - a.n);
  return out;
}

    <div class="tsum"><div class="tgrid"><div><b>${T.cal}</b><span>calendriers</span></div><div><b>${eur(T.dons)}</b><span>dons</span></div><div><b>${T.cal ? eur(T.dons / T.cal) : "–"}</b><span>par calendrier</span></div><div><b>${acc} %</b><span>portes qui donnent</span></div></div>
    <p class="ttot">Espèces ${eur(T.esp)} · Chèques ${eur(T.chq)} · Carte ${eur(T.cb)}</p></div>
    <div class="btab"><table><thead><tr><th>Tournée</th><th>Portes vues</th><th>Cal.</th><th>Dons</th><th>Moy.</th></tr></thead>
    <tbody>${rows.map(({ s, o }) => line(s.name, colorOf(s), o)).join("")}</tbody><tfoot>${line("Total " + S.data.commune, null, T)}</tfoot></table></div>
    <div class="foot2"><button class="btn" id="bVcsv">Exporter les passages pour le trésorier</button></div>`;
  $("bVcsv").onclick = exportVisits;
}
async function exportVisits() {
  const rows = [["Date", "Tournée", "Rue", "Numéro", "Suffixe", "Statut", "Calendriers", "Espèces", "Chèques", "Carte", "Total", "Note"]];
  for (const s of S.plan.sectors) {
    const V = S.visits[s.c] || {};
    for (const i of streetSort(Object.keys(V).map(Number))) {
      const v = V[i], p = S.data.pts[i]; const tot = (+v.esp || 0) + (+v.chq || 0) + (+v.cb || 0);
      const f = x => String(Math.round((+x || 0) * 100) / 100).replace(".", ",");
      rows.push([(v.d || "").slice(0, 10), s.name, S.data.voies[p[2]], p[3], p[4], STAT[v.s] ? STAT[v.s][0] : v.s, v.cal || 0, f(v.esp), f(v.chq), f(v.cb), f(tot), v.note || ""]);
    }
  }
  const csv = "﻿" + rows.map(r => r.map(x => { x = String(x); return /[;"\n]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x; }).join(";")).join("\r\n");
  const dl = window.claude ? await window.claude.use("downloads") : null;
  if (!dl) { toast("Export indisponible ici"); return; }
  try { await dl.save({ filename: `Passages ${S.data.commune} ${todayKey()}.csv`, data: csv }); toast("Fichier enregistré"); } catch (e) { if (e.code !== "declined") toast("Export impossible pour l'instant"); }
}
/* fiche d'une porte */
function closeSheet() { S.sheetIdx = -1; const el = $("sheet"); if (el) el.hidden = true; }
function openSheet(i, center) {
  if (S.assign[i] !== S.tour) return;
  S.sheetIdx = i; S.selected = i;
  const p = S.data.pts[i], v = visitOf(S.tour, i) || {};
  const s0 = v.s || "";
  const el = $("sheet"); el.hidden = false;
  el.innerHTML = `
    <div class="shead"><div><div class="sadr">${esc(addrLabel(i))}</div><div class="ssub">${esc(sectorBy(S.tour).name)}${v.d ? " · noté le " + new Date(v.d).toLocaleDateString("fr-FR") : ""}</div></div><button class="x" id="sClose" aria-label="Fermer">×</button></div>
    <div class="sstat">${Object.entries(STAT).map(([k, [l, c]]) => `<button data-s="${k}" aria-pressed="${s0 === k}" style="--c:${c}">${l}</button>`).join("")}</div>
    <div class="sdon" ${s0 === "fait" ? "" : "hidden"}>
      <label>Calendriers<div class="step"><button data-d="-1" type="button">−</button><input id="fCal" type="number" min="0" inputmode="numeric" value="${v.cal ?? 1}"><button data-d="1" type="button">+</button></div></label>
      <div class="money"><label>Espèces €<input id="fEsp" type="number" min="0" step="0.5" inputmode="decimal" value="${v.esp || ""}"></label>
      <label>Chèque €<input id="fChq" type="number" min="0" step="0.5" inputmode="decimal" value="${v.chq || ""}"></label>
      <label>Carte €<input id="fCb" type="number" min="0" step="0.5" inputmode="decimal" value="${v.cb || ""}"></label></div>
    </div>
    <label class="snote">Note (repère, horaire, sonnette…)<input id="fNote" maxlength="120" value="${esc(v.note || "")}" placeholder="ex. sonnette côté garage"></label>
    <div class="sact"><button class="btn primary" id="sSave">Enregistrer</button>${v.s ? `<button class="btn" id="sClear">Remettre à faire</button>` : ""}${v.s === "fait" ? `<button class="btn" id="sRecu">Reçu</button>` : ""}</div>`;
  let st = s0;
  el.querySelectorAll(".sstat button").forEach(b => b.onclick = () => {
    st = b.dataset.s; el.querySelectorAll(".sstat button").forEach(x => x.setAttribute("aria-pressed", x === b));
    el.querySelector(".sdon").hidden = st !== "fait";
  });
  el.querySelectorAll(".step button").forEach(b => b.onclick = () => { const f = $("fCal"); f.value = Math.max(0, (+f.value || 0) + +b.dataset.d); });
  $("sClose").onclick = () => { closeSheet(); S.selected = -1; draw(); };
  $("sSave").onclick = async () => {
    if (!st) { toast("Choisis d'abord : fait, absent, à repasser ou refus"); return; }
    const num = id => Math.max(0, Math.round((parseFloat(String($(id).value).replace(",", ".")) || 0) * 100) / 100);
    const body = { s: st, note: $("fNote").value.trim(), d: new Date().toISOString() };
    if (st === "fait") Object.assign(body, { cal: Math.round(num("fCal")), esp: num("fEsp"), chq: num("fChq"), cb: num("fCb") });
    await saveVisit(i, body);
  };
  const c = $("sClear"); if (c) c.onclick = async () => { await saveVisit(i, null); };
  const r = $("sRecu"); if (r) r.onclick = () => showReceipt(i);
  if (center) { const p2 = S.data.pts[i]; if (S.scale < 1.2) { S.scale = 1.6; } S.tx = W / 2 - p2[0] * S.scale; S.ty = H / 2 + p2[1] * S.scale; }
  draw();
}
async function saveVisit(i, body) {
  const code = S.tour, ref = S.db.doc(`tournees/${S.communeId}/${code}/${i}`);
  const prev = visitOf(code, i);
  S.visits[code] = S.visits[code] || {};
  if (body) S.visits[code][i] = body; else delete S.visits[code][i];
  closeSheet(); S.selected = -1; renderSide(); draw();
  try { if (body) await ref.set(body); else await ref.delete(); toast(body ? "Enregistré" : "Remis à faire"); }
  catch (e) {
    if (prev) S.visits[code][i] = prev; else delete S.visits[code][i];
    renderSide(); draw();
    toast(e && e.code === "invalid_argument" ? "Tu n'as pas le droit de noter les passages" : "Pas de réseau : passage non enregistré, réessaie");
  }
}
function showReceipt(i) {
  const v = visitOf(S.tour, i); if (!v) return;
  const tot = (+v.esp || 0) + (+v.chq || 0) + (+v.cb || 0);
  const modes = [["espèces", v.esp], ["chèque", v.chq], ["carte", v.cb]].filter(m => +m[1] > 0).map(m => `${m[0]} ${eur(+m[1])}`).join(", ");
  const d = new Date(v.d || Date.now());
  const no = `${S.data.commune.slice(0, 2).toUpperCase()}-${sectorBy(S.tour).name}-${i}-${d.toISOString().slice(0, 10).replace(/-/g, "")}`;
  const el = $("recu"); el.hidden = false;
  el.innerHTML = `<div class="rcard" id="rcard">
      <img src="logo.png" alt="" width="64" height="59">
      <h2>Amicale des sapeurs-pompiers de Gerzat</h2>
      <p class="rno">Reçu n° ${esc(no)}</p>
      <p>Reçu le ${d.toLocaleDateString("fr-FR")} au ${esc(addrLabel(i))}, ${esc(S.data.commune)},<br>la somme de <b>${eur(tot)}</b>${modes ? " (" + modes + ")" : ""}<br>pour ${v.cal || 0} calendrier${(v.cal || 0) > 1 ? "s" : ""}.</p>
      <p class="rsmall">Merci pour votre soutien. Ce reçu n'ouvre pas droit à une réduction d'impôt.</p>
    </div>
    <div class="ract"><button class="btn primary" id="rSave">Enregistrer en image</button><button class="btn" id="rClose">Fermer</button></div>`;
  $("rClose").onclick = () => { el.hidden = true; };
  $("rSave").onclick = async () => {
    const cv = document.createElement("canvas"), k = 2, w = 420, h = 300; cv.width = w * k; cv.height = h * k;
    const g = cv.getContext("2d"); g.scale(k, k); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h);
    const img = el.querySelector("img"); try { g.drawImage(img, 20, 18, 64, 59); } catch (e) {}
    g.fillStyle = "#b0181e"; g.font = "700 16px sans-serif"; g.fillText("Amicale des sapeurs-pompiers de Gerzat", 96, 40);
    g.fillStyle = "#555"; g.font = "12px sans-serif"; g.fillText("Reçu n° " + no, 96, 62);
    g.fillStyle = "#111"; g.font = "14px sans-serif";
    const L = [`Reçu le ${d.toLocaleDateString("fr-FR")} au ${addrLabel(i)}, ${S.data.commune},`, `la somme de ${eur(tot)}${modes ? " (" + modes + ")" : ""}`, `pour ${v.cal || 0} calendrier${(v.cal || 0) > 1 ? "s" : ""}.`];
    L.forEach((t, j) => g.fillText(t, 20, 120 + j * 24));
    g.fillStyle = "#555"; g.font = "11px sans-serif"; g.fillText("Merci pour votre soutien. Ce reçu n'ouvre pas droit à une réduction d'impôt.", 20, 270);
    const blob = await new Promise(r => cv.toBlob(r, "image/png"));
    const dl = window.claude ? await window.claude.use("downloads") : null;
    if (!dl) { toast("Enregistrement indisponible ici"); return; }
    try { await dl.save({ filename: `Recu ${no}.png`, data: blob }); toast("Reçu enregistré"); } catch (e) { if (e.code !== "declined") toast("Enregistrement impossible"); }
  };
}

/* ---------- Démarrage ---------- */
new ResizeObserver(() => { const first = !W; resize(); if (first) fitView(); }).observe($("mapwrap"));
if (document.fonts) document.fonts.ready.then(draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
renderTabs(); renderChip();
setStatus("load", "Connexion…");
loadCommune(LINK && COMMUNES.some(c => c.id === LINK.commune) ? LINK.commune : "gerzat");
(async () => {
  let db = null;
  try { db = window.claude ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { S.local = true; if (S.data) loadSnapshot(); return; }
  S.db = db;
  try {
    const u = await window.claude.use("user");
    const w = u ? await u.can("data.write") : null;
    const adm = u ? await u.canEdit() : false;
    if (!adm) setReadonly(true);
    S.canVisit = w !== false;
  } catch (e) {}
  if (S.data) subscribePlan();
})();
})();
</script>

<script>
if ("serviceWorker" in navigator) window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {}); });
</script>
