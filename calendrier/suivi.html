<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover">
<title>Suivi des tournées · Calendrier Gerzat</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#b0181e">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<script src="config.js"></script>
<style>
:root { --bg: #f3f4f6; --panel: #fff; --fg: #1d2329; --muted: #5f6b76; --line: #dfe3e8; --soft: #eef0f3; --accent: #c42b2b; --warn: #d98316; --ok: #2f8a57; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14181c; --panel: #1b2025; --fg: #e5e8eb; --muted: #9aa4ad; --line: #2c343b; --soft: #222930; --accent: #ec5a4e; } }
:root[data-theme="dark"] { --bg: #14181c; --panel: #1b2025; --fg: #e5e8eb; --muted: #9aa4ad; --line: #2c343b; --soft: #222930; --accent: #ec5a4e; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header img { height: 32px; border-radius: 6px; }
header h1 { margin: 0; font-size: 19px; flex: 1 1 auto; }
a.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 6px 10px; border-radius: 8px; font-weight: 600; font-size: 13px; text-decoration: none; }
main { max-width: 900px; margin: 0 auto; padding: 14px 16px 40px; }
.info { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.info b { color: var(--fg); }
.err { background: #fde8e6; color: #8a1f17; padding: 10px 12px; border-radius: 8px; margin: 0 0 12px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; }
section h2 { margin: 0 0 4px; font-size: 17px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
section h2 small { font-size: 13px; color: var(--muted); font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid var(--line); }
td { padding: 7px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; white-space: nowrap; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; }
td.nm a { color: var(--fg); font-weight: 700; text-decoration: none; }
td.pc { width: 34%; }
.bar { position: relative; height: 10px; background: var(--soft); border-radius: 5px; overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; }
.bar i.rep { background: #f08c00; }
.pc span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.rp { color: var(--warn); font-weight: 700; }
.fin td { font-weight: 700; }
@media (max-width: 560px) { th.hide, td.hide { display: none; } td.pc { width: 40%; } }

:root { --nuit: #14244b; --citron: #d8e021; --rouge: #d3222a; --font-titre: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
  --bg: #eef2f9; --fg: #131d35; --muted: #55617c; --line: #d6deec; --soft: #eef2f9; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d1424; --panel: #18223a; --fg: #e9eef8; --muted: #a3afc9; --line: #2c3853; --soft: #212c47; } }
body { margin: 0; font-family: Barlow, system-ui, sans-serif; }
header { position: relative; background: var(--nuit); color: #fff; border-bottom: 0; padding: calc(env(safe-area-inset-top, 0px) + 24px) max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
header::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: repeating-linear-gradient(115deg, var(--rouge) 0 18px, var(--citron) 18px 36px); }
header img { height: 46px; border-radius: 0; }
header h1 { font: 800 30px/.9 var(--font-titre); text-transform: uppercase; letter-spacing: .02em; }
a.btn { background: var(--rouge); color: #fff; border: 2px solid rgba(255,255,255,.9); border-radius: 999px; font: 800 18px/1 var(--font-titre); text-transform: uppercase; letter-spacing: .04em; padding: 7px 14px; }
section h2 { font: 800 26px/1 var(--font-titre); text-transform: uppercase; letter-spacing: .03em; align-items: baseline; }
section h2 small { font-family: Barlow, system-ui, sans-serif; }
td.nm a { font: 800 21px/1 var(--font-titre); letter-spacing: .02em; }
/* Bilan de fin de campagne : bouton de téléchargement du tableau */
.bilan { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin: 0 0 14px; }
.bilan button { display: inline-flex; align-items: center; gap: 8px; background: var(--rouge); color: #fff; border: 0; border-radius: 999px; padding: 9px 16px; font: 800 18px/1 var(--font-titre); text-transform: uppercase; letter-spacing: .04em; cursor: pointer; }
.bilan button:hover { background: #b81d24; }
.bilan button:disabled { opacity: .6; cursor: wait; }
.bilan button svg { width: 18px; height: 18px; }
.bilan small { color: var(--muted); font-size: 13px; }
</style>

<script>
(function () {
"use strict";
const COMMUNES = [["gerzat", "Gerzat"], ["aulnat", "Aulnat"], ["malintrat", "Malintrat"]];
const PALETTE = ["#d1495b","#2e86ab","#e09f3e","#3a9a68","#8e5ec7","#e0662f","#1c9a9a","#c4508e","#6f8f22","#4f6bd8","#a8743a","#c9b81f","#5aa9d8","#9b3d3d","#55b88a","#7d6aa8"];
const FB = (window.COCHES_FB || "").trim().replace(/\/+$/, "");
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let BASE = null;

async function getJson(u) { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error(u + " " + r.status); return r.json(); }

async function loadBase() {
  const snap = await getJson("snapshot.json");
  const out = {};
  for (const [id] of COMMUNES) {
    const d = await getJson(id + ".json"), sp = snap[id];
    const A = typeof sp.assign === "string" ? sp.assign : sp.assign.join("");
    const keyToC = new Map(), tot = {};
    d.pts.forEach((p, i) => { const c = A[i]; if (!c || c === ".") return; keyToC.set(p[2] + ":" + p[3] + ":" + (p[4] || ""), c); tot[c] = (tot[c] || 0) + 1; });
    out[id] = { sectors: sp.sectors, keyToC, tot };
  }

}

async function refresh() {
  const info = document.getElementById("info"), outEl = document.getElementById("out");
  if (!FB) { info.innerHTML = ""; outEl.innerHTML = '<p class="err">Les coches partagées ne sont pas activées (config.js vide).</p>'; return; }
  try {
    if (!BASE) BASE = await loadBase();
    let html = "", gT = 0, gD = 0, gR = 0;
    const lignes = [];
    for (const [id, name] of COMMUNES) {
      const B = BASE[id];
      const j = (await getJson(FB + "/coches/" + id + ".json")) || {};
      const d = {}, r = {};
      for (const k in j) {
        const c = B.keyToC.get(k.replace(/^k/, "")); if (!c) continue;
        if (j[k] === true) d[c] = (d[c] || 0) + 1; else if (j[k] === "r") r[c] = (r[c] || 0) + 1;
      }
      let cT = 0, cD = 0, cR = 0;
      const rows = B.sectors.map(s => {
        const n = B.tot[s.c] || 0, nd = d[s.c] || 0, nr = r[s.c] || 0;
        cT += n; cD += nd; cR += nr;
        lignes.push([name, s.name, n, nd, nr, PALETTE[(s.color || 0) % PALETTE.length]]);
        const pd = n ? 100 * nd / n : 0, pr = n ? 100 * nr / n : 0, col = PALETTE[(s.color || 0) % PALETTE.length];
        return `<tr><td class="nm"><span class="sw" style="background:${col}"></span><a href="./#${id}-${encodeURIComponent(s.name)}">${esc(s.name)}</a></td>
          <td class="n hide">${fmt(n)}</td><td class="n">${fmt(nd)}</td><td class="n${nr ? " rp" : ""}">${fmt(nr)}</td>
          <td class="pc"><div class="bar"><i style="left:0;width:${pd.toFixed(1)}%;background:#2f9e55"></i><i class="rep" style="left:${pd.toFixed(1)}%;width:${pr.toFixed(1)}%"></i></div><span>${Math.round(pd)} %${n && nd === n ? " · terminée" : ""}</span></td></tr>`;
      }).join("");
      gT += cT; gD += cD; gR += cR;
      lignes.push([name, "Total " + name, cT, cD, cR]);
      html += `<section><h2>${name} <small>${Math.round(cT ? 100 * cD / cT : 0)} % faites · ${fmt(cR)} à repasser</small></h2>
        <table><thead><tr><th>Tournée</th><th class="n hide">Adresses</th><th class="n">Faites</th><th class="n">À repasser</th><th>Avancement</th></tr></thead><tbody>${rows}</tbody></table></section>`;
    }
    outEl.innerHTML = html;
    lignes.push(["Toutes communes", "Total", gT, gD, gR]);
    BILAN = { lignes, quand: new Date() };
    document.getElementById("bilanBox").hidden = false;
    info.innerHTML = `Toutes communes : <b>${Math.round(gT ? 100 * gD / gT : 0)} %</b> des adresses faites (${fmt(gD)} sur ${fmt(gT)}), <b>${fmt(gR)}</b> à repasser. Mis à jour à ${new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}, rafraîchi toutes les 30 secondes.`;
  } catch (e) {
    info.innerHTML = `<span class="err">Impossible de lire les coches pour l'instant (réseau ?). Nouvel essai dans 30 secondes.</span>`;
  }
}
/* Bilan de fin de campagne : Excel et PDF mis en page, fabriqués dans le navigateur avec les coches lues */
const LIBS = {
  xlsx: ["https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"],
  pdf: ["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"]

const charge = {};
function script(u) {
  return charge[u] || (charge[u] = new Promise((ok, ko) => { const s = document.createElement("script"); s.src = u; s.onload = ok; s.onerror = () => { delete charge[u]; ko(new Error(u)); }; document.head.appendChild(s); }));
}
async function libs(k) { for (const u of LIBS[k]) await script(u); }
const nb = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

/* Données du bilan : communes, tournées, totaux */
function donnees() {
  const communes = [];
  let cur = null;
  for (const [c, t, n, d, r, col] of BILAN.lignes) {
    if (c === "Toutes communes") continue;
    if (!cur || cur.nom !== c) { cur = { nom: c, tournees: [], tot: null }; communes.push(cur); }
    const l = { nom: t, n, d, r, p: Math.max(0, n - d - r), col: col || "#999999" };
    if (t === "Total " + c) cur.tot = l; else cur.tournees.push(l);
  }
  const g = BILAN.lignes[BILAN.lignes.length - 1];
  const tot = { nom: "Toutes communes", n: g[2], d: g[3], r: g[4], p: Math.max(0, g[2] - g[3] - g[4]) };
  const w = BILAN.quand;
  return { communes, tot, jour: w.toLocaleDateString("fr-FR"), heure: w.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) };
}
async function logo() {
  const r = await fetch("logo.png"); const b = await r.blob();
  return new Promise(ok => { const f = new FileReader(); f.onload = () => ok(f.result); f.readAsDataURL(b); });
}
function enregistrer(blob, nom) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
async function bilanExcel() {
  await libs("xlsx");
  const D = donnees(), img = await logo();

    c.font = { bold: true, color: { argb: "FFFFFFFF" }, size: 11 };

    c.border = bord;
  });
  const entete = (ws, titre, larg) => {
    ws.addImage(idLogo, { tl: { col: 0.15, row: 0.15 }, ext: { width: 62, height: 62 } });

    ws.getCell(2, 2).value = titre + ", Amicale des sapeurs-pompiers de Gerzat";

  s1.getRow(5).height = 30;
  s1.getCell(5, 1).fill = { type: "pattern", pattern: "none" }; s1.getCell(5, 1).border = {};
  const l0 = 6;
  for (const c of D.communes) { const t = c.tot; const r = ligne(s1, ["", c.nom, t.n, t.d, t.r, t.p, t.n ? t.d / t.n : 0, t.n ? t.r / t.n : 0], {}); pcts(r, 7, 8); r.getCell(2).font = { bold: true }; }
  const rt = ligne(s1, ["", "Toutes communes", D.tot.n, D.tot.d, D.tot.r, D.tot.p, D.tot.n ? D.tot.d / D.tot.n : 0, D.tot.n ? D.tot.r / D.tot.n : 0], { gras: true, fond: "FFF6C2" });
  pcts(rt, 7, 8);

  for (let i = l0; i <= rt.number; i++) { s1.getCell(i, 1).border = {}; s1.getCell(i, 1).fill = { type: "pattern", pattern: "none" }; }

  const s2 = wb.addWorksheet("Détail par tournée", { views: [{ showGridLines: false, state: "frozen", ySplit: 5 }], pageSetup: { orientation: "portrait", fitToPage: true, fitToWidth: 1, fitToHeight: 0, printTitlesRow: "5:5" } });
  s2.columns = [{ width: 11 }, { width: 22 }, { width: 12 }, { width: 12 }, { width: 13 }, { width: 12 }, { width: 12 }, { width: 14 }];
  entete(s2, "Détail par tournée", 8);
  tete(s2, s2.addRow(["Commune", "Tournée", "Adresses", "Faites", "À repasser", "Pas faites", "% faites", "% à repasser"]));
  s2.getRow(5).height = 30;
  let debut = 6;
  for (const c of D.communes) {
    const d0 = s2.rowCount + 1;
    for (const t of c.tournees) {
      const r = ligne(s2, [c.nom, t.nom, t.n, t.d, t.r, t.p, t.n ? t.d / t.n : 0, t.n ? t.r / t.n : 0], {});
      pcts(r, 7, 8);
      r.getCell(2).fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF" + t.col.replace("#", "").toUpperCase() } };
      r.getCell(2).font = { bold: true, color: { argb: "FFFFFFFF" } };
      if (t.r) r.getCell(5).font = { bold: true, color: { argb: "FF" + ORANGE } };
    }
    const t = c.tot;
    const rt2 = ligne(s2, [c.nom, "Total " + c.nom, t.n, t.d, t.r, t.p, t.n ? t.d / t.n : 0, t.n ? t.r / t.n : 0], { gras: true, fond: GRIS });

  }

  pcts(rg, 7, 8);
  [3, 4, 5, 6].forEach(k => { for (let i = debut; i <= rg.number; i++) s2.getCell(i, k).numFmt = "# ##0"; });
  s2.addRow([]); s2.addRow(["Aucun nom d'habitant ni de donateur dans ce document."]).getCell(1).font = { italic: true, size: 9, color: { argb: "FF55617C" } };

  const buf = await wb.xlsx.writeBuffer();
  enregistrer(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), "Bilan calendriers " + D.jour.replace(/\//g, "-") + ".xlsx");
}
async function bilanPdf() {
  await libs("pdf");

  const W = 210, M = 14;
  const rgb = h => [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];

  for (let x = -10, i = 0; x < W + 10; x += 6, i++) { doc.setFillColor(...rgb(i % 2 ? CITRON : ROUGE)); doc.rect(x, 34, 6, 2.2, "F"); }

  doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(20);
  doc.text("BILAN DE LA TOURNÉE DES CALENDRIERS", M + 30, 16);
  doc.setFont("helvetica", "normal"); doc.setFontSize(11);
  doc.text("Amicale des sapeurs-pompiers de Gerzat", M + 30, 23);
  doc.text("Coches lues le " + D.jour + " à " + D.heure, M + 30, 29);
  /* Chiffres clés */

  const cases = [["Adresses", nb(D.tot.n), NUIT], ["Faites", nb(D.tot.d) + "  (" + pc(D.tot.d, D.tot.n) + ")", VERT], ["À repasser", nb(D.tot.r), ORANGE], ["Pas faites", nb(D.tot.p), ROUGE]];

    doc.setFillColor(...rgb(c)); doc.rect(x, y, 1.6, 22, "F");

    doc.setTextColor(...rgb(c)); doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.text(v, x + 5, y + 16);
  });

  /* Synthèse par commune */
  const titre = (t) => { doc.setTextColor(...rgb(NUIT)); doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.text(t.toUpperCase(), M, y); y += 3; };
  const styles = {
    theme: "grid", margin: { left: M, right: M, bottom: 18 },
    styles: { font: "helvetica", fontSize: 9.5, cellPadding: 2.2, lineColor: rgb("D6DEEC"), lineWidth: 0.2, textColor: rgb("131D35") },
    headStyles: { fillColor: rgb(NUIT), textColor: 255, fontStyle: "bold", halign: "center" },
    columnStyles: { 0: { halign: "left" }, 1: { halign: "right" }, 2: { halign: "right" }, 3: { halign: "right" }, 4: { halign: "right" }, 5: { halign: "left", cellWidth: 46 } }
  };

    doc.setFillColor(...rgb(GRIS)); doc.rect(x, yy, w, h, "F");

    didParseCell: d => { if (d.section === "body" && d.row.index === infoS.length - 1) { d.cell.styles.fontStyle = "bold"; d.cell.styles.fillColor = rgb("FFF6C2"); } if (d.section === "body" && d.column.index === 0) d.cell.styles.fontStyle = "bold"; },

      body: c.tournees.map(t => [t.nom, nb(t.n), nb(t.d), nb(t.r), nb(t.p), ""]).concat([["Total " + c.nom, nb(c.tot.n), nb(c.tot.d), nb(c.tot.r), nb(c.tot.p), ""]]),

  doc.setFillColor(...rgb(ORANGE)); doc.rect(M + 22, y - 2.5, 3, 3, "F"); doc.text("À repasser", M + 27, y);
  doc.text("Aucun nom d'habitant ni de donateur dans ce document.", W - M, y, { align: "right" });
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i);
    doc.setDrawColor(...rgb("D6DEEC")); doc.setLineWidth(0.3); doc.line(M, 285, W - M, 285);
    doc.setFontSize(8); doc.setTextColor(85, 97, 124);
    doc.text("Amicale des sapeurs-pompiers de Gerzat, bilan des calendriers du " + D.jour, M, 290);
    doc.text("Page " + i + " sur " + pages, W - M, 290, { align: "right" });
  }
  enregistrer(doc.output("blob"), "Bilan calendriers " + D.jour.replace(/\//g, "-") + ".pdf");
}
async function lancer(bouton, f) {
  if (!BILAN) return;
  const txt = document.getElementById("bilanTxt"), avant = txt.textContent;
  bouton.disabled = true; txt.textContent = "Préparation du fichier…";
  try { await f(); txt.textContent = avant; }
  catch (e) { txt.textContent = "Fichier impossible à préparer (réseau ?). Réessayez."; }
  bouton.disabled = false;
}
document.getElementById("bilanXlsx").onclick = e => lancer(e.currentTarget, bilanExcel);
document.getElementById("bilanPdf").onclick = e => lancer(e.currentTarget, bilanPdf);
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
})();
</script>
